name: Build ObjectivePGP Framework

on:
  workflow_dispatch:
  push:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Patch build script with compiler overrides
        run: |
          python3 -c '
import re
with open("scripts/build-frameworks.sh", "r") as f:
    content = f.read()

# 1. INJECT COMPILER OVERRIDES
# This forces Xcode to disable "Treat Warnings as Errors" and explicitly ignores the 
# new Xcode 26 strict float-conversion warnings for EVERY platform build.
content = re.sub(
    r"PLATFORM_NAME=\"\$\{PLATFORM_NAME\}\" \\\s*build",
    "PLATFORM_NAME=\"${PLATFORM_NAME}\" \\\n        GCC_TREAT_WARNINGS_AS_ERRORS=NO OTHER_CFLAGS=\"$(inherited) -Wno-error -Wno-implicit-int-float-conversion -Wno-error=implicit-int-float-conversion\" \\\n        build",
    content
)

# 2. FIX THE DITTO CRASH
# The original script hardcodes macOS SDKs up to version 14. 
# This wildcard replacement allows it to find the new macOS 15+ SDKs so the final copy step succeeds.
content = content.replace("macosx11.*|macosx12.*|macosx13.*|macosx14.*", "macosx.*")

with open("scripts/build-frameworks.sh", "w") as f:
    f.write(content)
          '

      - name: Build framework
        run: make frameworks

      - name: Upload framework
        uses: actions/upload-artifact@v4
        with:
          name: ObjectivePGP-Frameworks
          path: Frameworks/
