name: Build IPA

on:
  workflow_dispatch:
  push:

jobs:
  build:
    runs-on: macos-latest

    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Fix compile-time NSTimeInterval conversions
        shell: bash
        run: |
          set -euxo pipefail

          python3 - <<'PY'
          from pathlib import Path

          fixes = {
              Path("ObjectivePGP/PGPPartialKey.m"): [
                  (
                      "primaryUserSelfCertificate.keyExpirationTimeInterval != NSNotFound",
                      "primaryUserSelfCertificate.keyExpirationTimeInterval != (NSTimeInterval)NSNotFound",
                  ),
                  (
                      "dateByAddingTimeInterval:validityPeriod.unsignedIntegerValue",
                      "dateByAddingTimeInterval:(NSTimeInterval)validityPeriod.unsignedIntegerValue",
                  ),
              ],
              Path("ObjectivePGP/Packets/PGPSignaturePacket.m"): [
                  (
                      "return [creationDate dateByAddingTimeInterval:validityPeriod.unsignedIntegerValue];",
                      "return [creationDate dateByAddingTimeInterval:(NSTimeInterval)validityPeriod.unsignedIntegerValue];",
                  ),
                  (
                      "return NSNotFound;",
                      "return (NSTimeInterval)NSNotFound;",
                  ),
              ],
          }

          for path, replacements in fixes.items():
              text = path.read_text()
              original = text
              for old, new in replacements:
                  if old in text:
                      text = text.replace(old, new)
              if text != original:
                  path.write_text(text)
          PY

      - name: Fix NSUInteger/float conversion warnings in NSData+compression
        shell: bash
        run: |
          set -euxo pipefail

          python3 - <<'PY'
          from pathlib import Path

          path = Path("ObjectivePGP/Utils/NSData+compression.m")
          text = path.read_text()
          original = text

          replacements = {
              "compressed.length = (NSUInteger)(compressed.length * 1.5f);":
                  "compressed.length = (NSUInteger)((float)compressed.length * 1.5f);",
              "let decompressed = [NSMutableData dataWithLength:(NSUInteger)(self.length * 2.5f)];":
                  "let decompressed = [NSMutableData dataWithLength:(NSUInteger)((float)self.length * 2.5f)];",
              "decompressed.length = (NSUInteger)(decompressed.length * 1.5f);":
                  "decompressed.length = (NSUInteger)((float)decompressed.length * 1.5f);",
          }

          for old, new in replacements.items():
              text = text.replace(old, new)

          if text != original:
              path.write_text(text)
          PY

      - name: Build framework
        shell: bash
        run: |
          set -euxo pipefail
          make frameworks

      - name: Ensure app source dir exists
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p PGPApp/Sources
          touch PGPApp/Sources/.gitkeep

      - name: Install xcodegen
        shell: bash
        run: |
          set -euxo pipefail
          brew install xcodegen

      - name: Generate Xcode project
        working-directory: PGPApp
        shell: bash
        run: |
          set -euxo pipefail
          xcodegen generate
          ls -la
          if [ ! -f PGPApp.xcodeproj/project.pbxproj ]; then
            echo "xcodegen did not generate the app project"
            exit 1
          fi

      - name: Build app with explicit framework linkage
        working-directory: PGPApp
        shell: bash
        run: |
          set -euxo pipefail

          xcodebuild \
            -project PGPApp.xcodeproj \
            -scheme PGPApp \
            -sdk iphoneos \
            -configuration Release \
            -derivedDataPath build \
            -destination 'generic/platform=iOS' \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            ONLY_ACTIVE_ARCH=NO \
            FRAMEWORK_SEARCH_PATHS="$(pwd)/../Frameworks" \
            OTHER_LDFLAGS="-framework ObjectivePGP" \
            build

      - name: Create IPA
        shell: bash
        run: |
          set -euxo pipefail

          APP_PATH=$(find PGPApp/build/Build/Products/Release-iphoneos -name "*.app" | head -1)
          if [ -z "$APP_PATH" ]; then
            echo "No app bundle was produced"
            find PGPApp/build -maxdepth 5 -type d | head -50
            exit 1
          fi

          mkdir -p Payload
          cp -r "$APP_PATH" Payload/
          zip -r PGPApp.ipa Payload/

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: PGPApp-IPA
          path: PGPApp.ipa
