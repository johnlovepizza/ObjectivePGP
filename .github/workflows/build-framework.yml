name: Build IPA

on:
  workflow_dispatch:
  push:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Patch build script
        run: |
          sed -i '' 's/-Werror//g' ObjectivePGP.xcodeproj/project.pbxproj
          sed -i '' 's/GCC_TREAT_WARNINGS_AS_ERRORS = YES;/GCC_TREAT_WARNINGS_AS_ERRORS = NO;/g' ObjectivePGP.xcodeproj/project.pbxproj
          sed -i '' 's/PLATFORM_NAME="${PLATFORM_NAME}"/PLATFORM_NAME="${PLATFORM_NAME}" GCC_TREAT_WARNINGS_AS_ERRORS=NO OTHER_CFLAGS="-Wno-error -Wno-implicit-int-float-conversion"/g' scripts/build-frameworks.sh
          sed -i '' 's/macosx11.\*|macosx12.\*|macosx13.\*|macosx14.\*/macosx.*/g' scripts/build-frameworks.sh
          sed -i '' 's/xcrun codesign --timestamp -s "Apple Distribution"/# xcrun codesign --timestamp -s "Apple Distribution"/g' scripts/build-frameworks.sh

      - name: Build ObjectivePGP framework
        run: make frameworks

      - name: Ensure PGPApp source directory exists
        run: |
          mkdir -p PGPApp/Sources
          touch PGPApp/Sources/.gitkeep

      - name: Install xcodegen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: |
          cd PGPApp
          xcodegen generate

      - name: Build app
        run: |
          cd PGPApp
          xcodebuild -project PGPApp.xcodeproj \
            -scheme PGPApp \
            -sdk iphoneos \
            -configuration Release \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            ONLY_ACTIVE_ARCH=NO \
            build

      - name: Create IPA with Payload
        run: |
          APP_PATH=$(find PGPApp/build/Build/Products/Release-iphoneos -name "*.app" | head -1)
          mkdir -p Payload
          cp -r "$APP_PATH" Payload/
          zip -r PGPApp.ipa Payload/
          echo "✅ IPA created with Payload directory"
          ls -la Payload/

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: PGPApp-IPA
          path: PGPApp.ipa
