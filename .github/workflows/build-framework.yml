name: Build ObjectivePGP Framework

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '15.4'  #


      - name: Build framework
        run: make frameworks

      - name: Upload framework
        uses: actions/upload-artifact@v4
        with:
          name: ObjectivePGP-Frameworks
          path: Frameworks/
